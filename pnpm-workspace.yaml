allowBuilds:
  esbuild: true
  # The Kafka adapter's integration suite runs against both KafkaJS-shaped
  # clients; this one is a native librdkafka binding.
  "@confluentinc/kafka-javascript": true
  "@fails-components/webtransport-transport-http3-quiche": true
  # @grpc/proto-loader's protobufjs ships a postinstall that only checks its
  # own CLI's optional dependencies; the gRPC row of bench/rpc-comparison.js
  # (its only user) needs nothing from it. Denied on purpose, not forgotten.
  protobufjs: false
