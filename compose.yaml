# Local infrastructure for the pieces of the test and bench suites that need
# a real broker. Every consumer of it is gated on an env var and skips
# without one, so `pnpm test` never needs any of this.
#
#   pnpm redis:up
#   REDIS_URL=redis://127.0.0.1:6379 node --test tests/scaling/redis.integration.test.js
#   REDIS_URL=redis://127.0.0.1:6379 node bench/cluster-nodes.js
#   pnpm redis:down
#
# The message-broker family (`@alexify/wrpc/broker*`) adds RabbitMQ, Kafka and
# NATS; `pnpm brokers:up` (docker compose up -d) starts all four:
#
#   AMQP_URL=amqp://127.0.0.1:5672     (management UI on http://127.0.0.1:15672, guest/guest)
#   KAFKA_BROKERS=127.0.0.1:9092       (single-node KRaft)
#   NATS_URL=nats://127.0.0.1:4222     (JetStream enabled; monitoring on :8222)
#
# No volumes: nothing here is worth keeping between runs.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  nats:
    image: nats:2-alpine
    ports:
      - '127.0.0.1:4222:4222'
      - '127.0.0.1:8222:8222'
    command: ['-js', '-m', '8222']
